worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # servicios
    upstream user_services {
        server users:8000;
        keepalive 16;
    }

    upstream core_services {
        server core-service:8000;
        keepalive 16;
    }

    limit_req_zone "test" zone=health_limit:2m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;
    
    # Mapas de validación
    map $http_x_api_key $missing_api_key {
        "" 1;
        "~^\s*$" 1;
        default 0;
    }

    map $http_x_origin $missing_origin {
        "" 1;
        "~^\s*$" 1;
        default 0;
    }

    # ── CORS Headers ──────────────────────────────────────────────────────
    map $http_origin $cors_origin {
        "http://localhost:3000" "http://localhost:3000";
        "http://localhost:3001" "http://localhost:3001";
        "http://localhost:5173" "http://localhost:5173";
        "http://127.0.0.1:3000" "http://127.0.0.1:3000";
        "http://127.0.0.1:3001" "http://127.0.0.1:3001";
        "http://127.0.0.1:5173" "http://127.0.0.1:5173";
        default "";
    }

    # Mapas para validación condicional (no validar en OPTIONS)
    map $request_method $gateway_needs_headers {
        OPTIONS 0;
        default 1;
    }

    map "$gateway_needs_headers:$missing_api_key" $reject_no_api_key {
        default 0;
        "1:1" 1;
    }

    map "$gateway_needs_headers:$missing_origin" $reject_no_origin {
        default 0;
        "1:1" 1;
    }

    server{
        listen      80;
        server_name  localhost;
        
        limit_req_status 429;

        location /check {
            add_header Content-Type text/plain;
            return 200 'Getaway OK';
        }

        location = /core/api/v1/health/ {
            # Permitir OPTIONS sin validación (preflight)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-api-key, x-origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                return 204;
            }

            proxy_pass http://core_services/api/v1/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location /core/api/v1/ {
            # Permitir OPTIONS sin validación (preflight)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-api-key, x-origin, x-customer-id" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                return 204;
            }

            # Validar headers solo en requests reales (no OPTIONS)
            if ($reject_no_api_key) {
                add_header Content-Type application/json always;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 401 '{"success":false,"message":"x-api-key header is required","data":null,"status":401}';
            }
            if ($reject_no_origin) {
                add_header Content-Type application/json always;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 401 '{"success":false,"message":"x-origin header is required","data":null,"status":401}';
            }

            proxy_pass http://core_services/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_set_header X-ORIGIN $http_x_origin;
            proxy_set_header X-CUSTOMER-ID $http_x_customer_id;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location = /user/api/v1 {
            return 301 /user/api/v1/;
        }

        location = /user/api/v1/docs {
            return 301 /user/api/v1/docs/;
        }

        location = /schema {
            return 301 /schema/;
        }

        location /schema/ {
            # Permitir OPTIONS sin validación (preflight)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-api-key, x-origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                return 204;
            }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user_services/schema/;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location /user/api/v1/docs/ {
            # Permitir OPTIONS sin validación (preflight)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-api-key, x-origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                return 204;
            }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user_services/gateway-docs/;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location = /user/api/v1/schema {
            return 301 /user/api/v1/schema/;
        }

        location /user/api/v1/schema/ {
            # Permitir OPTIONS sin validación (preflight)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-api-key, x-origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                return 204;
            }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://user_services/schema/;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location /user/api/v1/ {
            # Permitir OPTIONS sin validación (preflight)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-api-key, x-origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                return 204;
            }

            # Validar headers solo en requests reales (no OPTIONS)
            if ($reject_no_api_key) {
                add_header Content-Type application/json always;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 401 '{"success":false,"message":"x-api-key header is required","data":null,"status":401}';
            }
            if ($reject_no_origin) {
                add_header Content-Type application/json always;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 401 '{"success":false,"message":"x-origin header is required","data":null,"status":401}';
            }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_set_header X-ORIGIN $http_x_origin;
            proxy_pass http://user_services/;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        location /user/api/v2 {
            # Permitir OPTIONS sin validación (preflight)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-api-key, x-origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0 always;
                return 204;
            }

            # Validar headers solo en requests reales (no OPTIONS)
            if ($reject_no_api_key) {
                add_header Content-Type application/json always;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 401 '{"success":false,"message":"x-api-key header is required","data":null,"status":401}';
            }
            if ($reject_no_origin) {
                add_header Content-Type application/json always;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                return 401 '{"success":false,"message":"x-origin header is required","data":null,"status":401}';
            }

            add_header Content-Type text/plain;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            return 200 'User API v2 OK';
        }

        location / {
            add_header Content-Type text/plain;
            return 404 'Not Found';
        }
    }
}