version: "3.9"

services:

  getaway:
    image: nginx:1.25-alpine
    container_name: ip_getaway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - users
      - core-service
    labels:
     - "ip_getaway.version=1.0"
    networks:
      - ip_network

  users:
    build:
      context: ./services/users
    container_name: ip_users
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./services/users:/app:Z
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      users_db:
        condition: service_healthy
    networks:
      - ip_network

  users_db:
    image: postgres:15-alpine
    container_name: users_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ip_network

  core_db:
    image: postgres:15-alpine
    container_name: core_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: core_db
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: core_pass
    volumes:
      - core_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d core_db -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ip_network

  mongodb:
    image: mongo:7.0
    container_name: ip_mongodb
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: core_db
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - ip_network
  
  mongo-express:
    image: mongo-express:1.0.2
    container_name: ip_mongo_express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - ip_network

  core-service:
    build:
      context: ./services/servicecore
    container_name: ip_core
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 core.wsgi:application"
    volumes:
      - ./services/servicecore:/app:Z
    env_file:
      - .env
    environment:
      CORE_DB_HOST: core_db
      CORE_DB_NAME: core_db
      CORE_DB_USER: core_user
      CORE_DB_PASSWORD: core_pass
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      core_db:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - ip_network

  core_worker:
    build:
      context: ./services/servicecore
    container_name: ip_core_worker
    command: celery -A core worker --loglevel=info
    volumes:
      - ./services/servicecore:/app:Z
    env_file:
      - .env
    environment:
      CORE_DB_HOST: core_db
      CORE_DB_NAME: core_db
      CORE_DB_USER: core_user
      CORE_DB_PASSWORD: core_pass
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      core_db:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - ip_network

  redis:
    image: redis:7-alpine
    container_name: ip_redis
    networks:
      - ip_network

  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: ip_pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      users_db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ip_network


networks:
  ip_network:
    driver: bridge

volumes:
  users_db_data:
  pgadmin_data:
  core_db_data:
  mongodb_data:
